version: '3.8'

services:
  agentic-cti:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agentic-cti
    restart: unless-stopped

    environment:
      # LLM Configuration
      - LLM_PROVIDER=${LLM_PROVIDER:-ollama}
      - LLM_MODEL=${LLM_MODEL:-llama3.2:latest}
      - LLM_BASE_URL=${LLM_BASE_URL:-http://ollama:11434}
      - LLM_TEMPERATURE=${LLM_TEMPERATURE:-0.3}
      - LLM_MAX_TOKENS=${LLM_MAX_TOKENS:-4096}

      # Email Configuration
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USE_TLS=${SMTP_USE_TLS:-true}
      - SMTP_USERNAME=${SMTP_USERNAME}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - EMAIL_FROM=${EMAIL_FROM}
      - EMAIL_TO=${EMAIL_TO}
      - EMAIL_DAILY_TIME=${EMAIL_DAILY_TIME:-07:00}
      - EMAIL_TIMEZONE=${EMAIL_TIMEZONE:-America/Montreal}

      # STIX Export
      - ENABLE_STIX_EXPORT=${ENABLE_STIX_EXPORT:-true}
      - STIX_EXPORT_PATH=/app/data/stix_exports

      # Trend Vision One
      - TREND_VISION_ONE_ENABLED=${TREND_VISION_ONE_ENABLED:-false}
      - TREND_VISION_ONE_API_KEY=${TREND_VISION_ONE_API_KEY}
      - TREND_VISION_ONE_REGION=${TREND_VISION_ONE_REGION:-us}

      # OpenCTI
      - OPENCTI_ENABLED=${OPENCTI_ENABLED:-false}
      - OPENCTI_URL=${OPENCTI_URL:-http://opencti:8080}
      - OPENCTI_API_KEY=${OPENCTI_API_KEY}

      # Streamlit UI
      - STREAMLIT_PORT=${STREAMLIT_PORT:-8501}
      - STREAMLIT_AUTH_ENABLED=${STREAMLIT_AUTH_ENABLED:-true}
      - STREAMLIT_USERNAME=${STREAMLIT_USERNAME:-admin}
      - STREAMLIT_PASSWORD=${STREAMLIT_PASSWORD:-changeme}

      # Agent Configuration
      - AGENT_RUN_INTERVAL=${AGENT_RUN_INTERVAL:-86400}
      - AGENT_MAX_SOURCES=${AGENT_MAX_SOURCES:-20}
      - AGENT_MAX_ARTICLES_PER_SOURCE=${AGENT_MAX_ARTICLES_PER_SOURCE:-10}

      # Logging
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - LOG_FILE=/app/logs/agentic_cti.log

      # Crawl4ai
      - CRAWL4AI_BASE_URL=${CRAWL4AI_BASE_URL:-http://crawl4ai:11235}
      - USE_CRAWL4AI=${USE_CRAWL4AI:-false}

    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./config:/app/config

    ports:
      - "${STREAMLIT_PORT:-8501}:8501"

    networks:
      - agentic-cti-network

    depends_on:
      - ollama

    command: python main.py schedule

  # Streamlit UI (separate container for better resource management)
  agentic-cti-ui:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agentic-cti-ui
    restart: unless-stopped

    environment:
      - LLM_PROVIDER=${LLM_PROVIDER:-ollama}
      - LLM_MODEL=${LLM_MODEL:-llama3.2:latest}
      - LLM_BASE_URL=${LLM_BASE_URL:-http://ollama:11434}
      - STREAMLIT_AUTH_ENABLED=${STREAMLIT_AUTH_ENABLED:-true}
      - STREAMLIT_USERNAME=${STREAMLIT_USERNAME:-admin}
      - STREAMLIT_PASSWORD=${STREAMLIT_PASSWORD:-changeme}

    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./config:/app/config

    ports:
      - "8502:8501"

    networks:
      - agentic-cti-network

    command: python main.py ui

  # Ollama for local LLM inference
  ollama:
    image: ollama/ollama:latest
    container_name: agentic-cti-ollama
    restart: unless-stopped

    volumes:
      - ollama-data:/root/.ollama

    ports:
      - "11434:11434"

    networks:
      - agentic-cti-network

    # Optional: Pull model on startup
    # entrypoint: ["/bin/sh", "-c", "ollama serve & sleep 5 && ollama pull llama3.2:latest && wait"]

  # Crawl4ai for advanced web scraping with JavaScript support
  crawl4ai:
    image: unclecode/crawl4ai:latest
    container_name: agentic-cti-crawl4ai
    restart: unless-stopped

    ports:
      - "11235:11235"

    networks:
      - agentic-cti-network

    environment:
      - CRAWL4AI_API_TOKEN=${CRAWL4AI_API_TOKEN:-}

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11235/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # REST API for URL submission
  agentic-cti-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agentic-cti-api
    restart: unless-stopped

    environment:
      - LLM_PROVIDER=${LLM_PROVIDER:-ollama}
      - LLM_MODEL=${LLM_MODEL:-llama3.2:latest}
      - LLM_BASE_URL=${LLM_BASE_URL:-http://ollama:11434}
      - CRAWL4AI_BASE_URL=${CRAWL4AI_BASE_URL:-http://crawl4ai:11235}
      - API_RATE_LIMIT=${API_RATE_LIMIT:-100}
      - API_RATE_LIMIT_PERIOD=${API_RATE_LIMIT_PERIOD:-60}

    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./config:/app/config

    ports:
      - "${API_PORT:-8000}:8000"

    networks:
      - agentic-cti-network

    depends_on:
      - crawl4ai
      - ollama

    command: python -m api.main

  # Optional: OpenCTI (uncomment to enable)
  # opencti:
  #   image: opencti/platform:latest
  #   container_name: agentic-cti-opencti
  #   restart: unless-stopped
  #   environment:
  #     - OPENCTI_ADMIN_EMAIL=admin@opencti.io
  #     - OPENCTI_ADMIN_PASSWORD=changeme
  #     - OPENCTI_ADMIN_TOKEN=${OPENCTI_API_KEY}
  #   ports:
  #     - "8080:8080"
  #   networks:
  #     - agentic-cti-network

networks:
  agentic-cti-network:
    driver: bridge

volumes:
  ollama-data:
    driver: local
