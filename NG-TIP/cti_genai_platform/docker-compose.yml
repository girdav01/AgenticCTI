version: '3.8'

services:
  # CTI Platform Application
  cti-platform:
    build: .
    container_name: cti-genai-platform
    ports:
      - "8501:8501"
    environment:
      - LLM_PROVIDER=${LLM_PROVIDER:-ollama}
      - LLM_MODEL=${LLM_MODEL:-llama3.2}
      - LLM_BASE_URL=${LLM_BASE_URL:-http://ollama:11434}
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=password
      - MISP_URL=${MISP_URL}
      - MISP_API_KEY=${MISP_API_KEY}
      - OPENCTI_URL=${OPENCTI_URL}
      - OPENCTI_TOKEN=${OPENCTI_TOKEN}
    volumes:
      - ./data:/app/data
      - ./cache:/app/cache
      - ./logs:/app/logs
    depends_on:
      - neo4j
      - ollama
    networks:
      - cti-network
    restart: unless-stopped

  # Ollama for local LLM
  ollama:
    image: ollama/ollama:latest
    container_name: cti-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    networks:
      - cti-network
    restart: unless-stopped
    # Uncomment if you have GPU support
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  # Neo4j Graph Database
  neo4j:
    image: neo4j:5.14-community
    container_name: cti-neo4j
    ports:
      - "7474:7474"  # HTTP
      - "7687:7687"  # Bolt
    environment:
      - NEO4J_AUTH=neo4j/password
      - NEO4J_PLUGINS=["apoc", "graph-data-science"]
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*,gds.*
      - NEO4J_dbms_memory_heap_initial__size=512m
      - NEO4J_dbms_memory_heap_max__size=2G
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs
      - neo4j-plugins:/plugins
    networks:
      - cti-network
    restart: unless-stopped

  # Optional: OpenCTI Platform
  opencti:
    image: opencti/platform:latest
    container_name: cti-opencti
    environment:
      - NODE_OPTIONS=--max-old-space-size=8096
      - APP__PORT=8080
      - APP__BASE_URL=http://localhost:8080
      - APP__ADMIN__EMAIL=admin@opencti.io
      - APP__ADMIN__PASSWORD=ChangeMePlease
      - APP__ADMIN__TOKEN=${OPENCTI_ADMIN_TOKEN:-}
      - APP__APP_LOGS__LOGS_LEVEL=error
      - REDIS__HOSTNAME=redis
      - REDIS__PORT=6379
      - ELASTICSEARCH__URL=http://elasticsearch:9200
      - MINIO__ENDPOINT=minio
      - MINIO__PORT=9000
      - MINIO__USE_SSL=false
      - MINIO__ACCESS_KEY=opencti
      - MINIO__SECRET_KEY=ChangeMePlease
      - RABBITMQ__HOSTNAME=rabbitmq
      - RABBITMQ__PORT=5672
      - RABBITMQ__PORT_MANAGEMENT=15672
      - RABBITMQ__MANAGEMENT_SSL=false
      - RABBITMQ__USERNAME=opencti
      - RABBITMQ__PASSWORD=ChangeMePlease
    ports:
      - "8080:8080"
    depends_on:
      - redis
      - elasticsearch
      - minio
      - rabbitmq
    networks:
      - cti-network
    restart: unless-stopped
    profiles:
      - opencti  # Only start when explicitly requested

  # OpenCTI Dependencies
  redis:
    image: redis:7.2-alpine
    container_name: cti-redis
    volumes:
      - redis-data:/data
    networks:
      - cti-network
    restart: unless-stopped
    profiles:
      - opencti

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: cti-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    networks:
      - cti-network
    restart: unless-stopped
    profiles:
      - opencti

  minio:
    image: minio/minio:latest
    container_name: cti-minio
    environment:
      - MINIO_ROOT_USER=opencti
      - MINIO_ROOT_PASSWORD=ChangeMePlease
    command: server /data
    volumes:
      - minio-data:/data
    networks:
      - cti-network
    restart: unless-stopped
    profiles:
      - opencti

  rabbitmq:
    image: rabbitmq:3.12-management
    container_name: cti-rabbitmq
    environment:
      - RABBITMQ_DEFAULT_USER=opencti
      - RABBITMQ_DEFAULT_PASS=ChangeMePlease
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - cti-network
    restart: unless-stopped
    profiles:
      - opencti

networks:
  cti-network:
    driver: bridge

volumes:
  ollama-data:
  neo4j-data:
  neo4j-logs:
  neo4j-plugins:
  redis-data:
  elasticsearch-data:
  minio-data:
  rabbitmq-data:
